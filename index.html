い感覚に気づくと、脳はこの経験をより深く記憶します。", "我完成了一件重要的事，覺得自己做得到": "大切なことをやり遂げ、自分にもできると感じる", "我收到肯定或好消息，覺得自己被看見": "認められたり良い知らせを受け、認められたと感じる", "我和喜歡的人相處，覺得彼此很靠近": "好きな人と過ごし、互いに近いと感じる", "我正在享受當下，覺得生活很美好": "今この時を楽しみ、人生が美しいと感じる", "沒有特別原因，只是感覺心情很好": "特に理由はなく、ただ気分が良い", "停留幾秒，好好感受這份喜樂": "数秒とどまり、この喜びをしっかり味わう", "把這個時刻記錄下來": "この瞬間を記録する", "和重要的人分享": "大切な人と分かち合う", "用這份能量完成一件事": "このエネルギーで一つ成し遂げる", "安靜享受，不急著做任何事": "静かに味わい、何も急がない", "這份平靜怎麼得到的？": "この平安はどうやって得られましたか？", "你想如何維持這份平靜？": "この平安をどう保ちたいですか？", "當大腦判斷環境安全時，自律神經會逐漸由警戒狀態轉向休息與修復，有助於思緒清楚與身體放鬆。": "脳が環境を安全と判断すると、自律神経は警戒から休息・修復へと移り、思考が明晰になり体がリラックスします。", "有人關心或幫助我，我覺得自己不是孤單的": "誰かが気にかけ助けてくれ、独りではないと感じる", "我看見一件溫暖的事，覺得生活仍有美好": "温かい出来事を見て、人生にまだ美しさがあると感じる", "我想起珍貴的經驗，覺得值得珍惜": "大切な経験を思い出し、尊いと感じる", "我發現自己已經擁有很多，覺得很滿足": "すでに多くを持っていると気づき、満ち足りを感じる", "我受到支持，覺得自己被理解": "支えられ、理解されたと感じる", "安靜坐一下，維持平穩呼吸": "静かに座り、落ち着いた呼吸を保つ", "慢慢散步或伸展身體": "ゆっくり散歩するか体を伸ばす", "暫時減少手機與外界訊息": "しばらくスマホや外部情報を減らす", "專心完成一件簡單的事": "簡単なことを一つ集中して終える", "讓自己多休息幾分鐘": "あと数分、自分を休ませる", "這份感謝主要來自什麼？": "この感謝は主に何から来ていますか？", "你想如何表達這份感謝？": "この感謝をどう表したいですか？", "感謝能幫助注意力從不足與壓力，轉向已經擁有的支持與資源，有助於提升心理韌性與人際連結。": "感謝は注意を「不足とストレス」から「すでにある支えと資源」へ向け、心の回復力と人とのつながりを高めます。", "事情暫時告一段落，我覺得可以放鬆了": "物事が一区切りつき、緩めてよいと感じる", "我身處熟悉安全的環境，覺得不用警戒": "慣れた安全な環境にいて、警戒しなくてよいと感じる", "有可信任的人陪伴，我覺得很安心": "信頼できる人がそばにいて安心する", "我終於有自己的時間，覺得不需要急": "ようやく自分の時間ができ、急がなくてよいと感じる", "我接受事情目前的樣子，覺得可以慢下來": "今の状態を受け入れ、ゆっくりできると感じる", "傳訊息向對方表達感謝": "メッセージで感謝を伝える", "親口說一句謝謝": "直接ありがとうと言う", "把這件事記錄下來": "このことを記録する", "用一個小行動回饋別人": "小さな行動で誰かに返す", "安靜感受這份溫暖": "静かにこの温かさを味わう", "這份盼望主要來自哪裡？": "この希望は主にどこから来ていますか？", "現在最適合採取哪個行動？": "今、どの行動が最も適していますか？", "盼望並不代表確定成功，而是大腦看見「還有可能」，並願意尋找可行路徑與下一步。": "希望は成功の確約ではなく、脳が「まだ可能だ」と見て、実行可能な道と次の一歩を探そうとすることです。", "我看見事情改善的可能，覺得還有機會": "改善の可能性が見え、まだチャンスがあると感じる", "我有一個想完成的目標，覺得值得努力": "達成したい目標があり、努力する価値を感じる", "我得到新的資訊或機會，覺得可以再試一次": "新しい情報や機会を得て、もう一度試せると感じる", "雖然還不確定，我仍相信會慢慢變好": "まだ不確かでも、少しずつ良くなると信じる", "我想重新開始，覺得未來可以不同": "やり直したい、未来は変えられると感じる", "設定一個簡單的小目標": "簡単な小さな目標を立てる", "完成第一個可行步驟": "実行可能な最初の一歩を終える", "找一位可以支持我的人": "支えてくれる人を見つける", "把期待的改變記錄下來": "望む変化を書き留める", "提醒自己不用一次做到全部": "全部を一度にやらなくてよいと自分に言い聞かせる", "此刻的知足主要來自什麼？": "今の満足は主に何から来ていますか？", "你想如何保留這份感受？": "この感覚をどう保ちたいですか？", "知足不是停止進步，而是讓大腦同時看見已經擁有的資源，避免注意力長期停留在不足與比較。": "満足は成長をやめることではなく、すでにある資源にも気づかせ、注意が不足や比較に居続けないようにします。", "我的基本需要得到滿足，覺得已經足夠": "基本的な必要が満たされ、十分だと感じる", "我看見目前擁有的人事物，覺得值得珍惜": "今ある人や物に気づき、尊いと感じる", "我暫時停止比較，覺得自己也很好": "比較をやめ、自分も良いと感じる", "我接受事情目前的狀態，覺得不必強求": "今の状態を受け入れ、無理に求めなくてよいと感じる", "我發現簡單的生活也能帶來滿足": "シンプルな暮らしも満足をもたらすと気づく", "記下一件值得珍惜的事": "大切にしたいことを一つ書く", "專心享受眼前的生活": "目の前の暮らしを集中して味わう", "向重要的人表達關心": "大切な人に思いやりを示す", "減少不必要的比較": "不要な比較を減らす", "保留一段安靜的時間": "静かな時間を確保する", "是什麼讓你有興奮地感受？": "何があなたをわくわくさせていますか？", "現在最適合怎麼做？": "今、どうするのが最適ですか？", "興奮會提高身體的喚醒程度與行動動機。保留熱情的同時稍微放慢，有助於維持判斷力。": "興奮は体の覚醒度と行動意欲を高めます。情熱を保ちつつ少し緩めると、判断力を保てます。", "即將參加期待的活動，我很想趕快開始": "楽しみな予定が近く、早く始めたい", "出現新的機會，我覺得充滿可能": "新しい機会が現れ、可能性に満ちていると感じる", "我完成目標，覺得自己很有能力": "目標を達成し、自分は有能だと感じる", "我接觸到新鮮事物，覺得非常有趣": "新鮮なものに触れ、とても面白いと感じる", "我有很多想法，覺得現在就想行動": "アイデアが多く、今すぐ動きたい", "把想法與重點記錄下來": "アイデアと要点を記録する", "先確認行動步驟": "まず行動手順を確認する", "和別人分享這份期待": "この期待を人と分かち合う", "稍微放慢，避免衝動決定": "少し緩め、衝動的な決断を避ける", "把能量集中在一件事情上": "エネルギーを一つのことに集中する", "這份愛意主要指向誰或什麼？": "この愛情は主に誰・何に向いていますか？", "你想如何表達？": "どう表現したいですか？", "愛與安全連結能支持大腦的情緒調節，降低孤立感。穩定關係需要透過持續且具體的行動表達。": "愛と安心のつながりは脳の感情調整を支え、孤立感を和らげます。安定した関係は、継続的で具体的な行動によって表されます。", "我想靠近重要的人，覺得和他有深厚連結": "大切な人に近づきたく、深いつながりを感じる", "我想照顧某個人，覺得他的感受很重要": "誰かを大切にしたく、その人の気持ちが重要だと感じる", "我被理解與接納，覺得很安全": "理解され受け入れられ、安全だと感じる", "我對自己感到溫柔，覺得值得被照顧": "自分に優しくなれ、ケアされる価値があると感じる", "我對生命、動物或自然感到親近": "命・動物・自然に親しみを感じる", "說一句關心或肯定的話": "思いやりや肯定の言葉を一つ言う", "給予陪伴或擁抱": "寄り添うか抱きしめる", "主動提供實際幫助": "進んで具体的な助けを申し出る", "為自己做一件照顧身體的事": "自分の体をいたわることを一つする", "留一點時間陪伴重要的人": "大切な人と過ごす時間を取る", "這份敬畏主要來自什麼？": "この畏敬は主に何から来ていますか？", "你想如何回應這份感受？": "この感覚にどう応えたいですか？", "敬畏感能讓注意力暫時離開過度自我關注，擴展到更大的生命經驗，有助於重新整理觀點。": "畏敬は注意を過度な自己注目からより大きな生命経験へと広げ、視点を整え直す助けになります。", "我看見壯麗的自然，覺得世界比自己更廣大": "雄大な自然を見て、世界は自分よりはるかに大きいと感じる", "我感受到生命或科學的奧妙，覺得不可思議": "生命や科学の神秘を感じ、不思議だと思う", "我被藝術或音樂觸動，覺得非常震撼": "芸術や音楽に触れ、深く揺さぶられた", "我看見他人的勇氣與成就，覺得深受感動": "他者の勇気や功績を見て、深く感動した", "我突然對人生有新的理解，覺得視野被打開": "人生への新たな理解が生まれ、視野が開けた", "安靜停留，感受這個時刻": "静かにとどまり、この瞬間を感じる", "拍照或記錄": "写真を撮るか記録する", "和別人分享這份感受": "この感覚を人と分かち合う", "把感動轉化為一個行動": "感動を一つの行動に変える", "暫時放下日常煩惱": "日常の悩みを一旦手放す", "這個疲憊得感受最可能來自什麼？": "この疲れは何から来ている可能性が高いですか？", "現在最需要哪種調整？": "今、どんな調整が最も必要ですか？", "疲憊會降低專注、判斷與情緒調節能力。若長期休息後仍未改善，也需要留意身體與心理狀態。": "疲れは集中力・判断力・感情調整を低下させます。長く休んでも改善しない場合は、心身の状態にも注意が必要です。", "我睡眠不足，覺得身體需要補眠": "睡眠不足で、体が眠りを必要としている", "我工作或活動太久，覺得能量被消耗": "働きすぎ・動きすぎでエネルギーが消耗した", "我承受壓力很久，覺得什麼都不想做": "長くストレスを受け、何もしたくないと感じる", "我一直照顧別人，覺得沒有力氣照顧自己": "ずっと人の世話をし、自分をケアする力がない", "我沒有明顯原因，卻持續覺得很累": "はっきりした理由はないのに、ずっと疲れている", "補充水分或食物": "水分か食べ物をとる", "閉眼休息幾分鐘": "目を閉じて数分休む", "起身伸展或短暫散步": "立って伸びをするか少し散歩する", "暫停不必要的工作": "不要な作業を一旦止める", "安排睡眠或尋求專業評估": "睡眠を確保するか専門家の評価を求める", "這份孤單比較接近哪種狀況？": "この孤独はどの状況に近いですか？", "現在可以做哪個小行動？": "今できる小さな行動は？", "孤單是大腦提醒我們需要人際連結的訊號，不代表自己不受歡迎，也不代表只能獨自承受。": "孤独は「人とのつながりが必要だ」という脳の合図であり、好かれていないという意味でも、一人で抱えるしかないという意味でもありません。", "身邊沒有人陪伴，我覺得很空": "そばに誰もおらず、空虚に感じる", "雖然有人在身邊，我仍覺得沒人理解": "人がいても、理解されていないと感じる", "我和重要的人疏遠了，覺得失去連結": "大切な人と疎遠になり、つながりを失ったと感じる", "我在陌生環境中，覺得沒有歸屬感": "慣れない環境で、居場所がないと感じる", "我想找人說話，卻不知道可以找誰": "話したいのに、誰に頼ればいいか分からない", "傳訊息給一位熟悉的人": "親しい人にメッセージを送る", "打電話和人聊幾分鐘": "電話で数分話す", "到有人活動的地方走走": "人が集まる場所へ出かける", "參加一個有共同興趣的活動": "共通の趣味の活動に参加する", "先陪伴自己，做一件喜歡的事": "まず自分に寄り添い、好きなことをする", "你主要在擔心什麼？": "主に何を心配していますか？", "現在最適合做什麼？": "今、何をするのが最適ですか？", "擔憂是大腦預測風險的方式，但預測不等於事實。區分可控制與不可控制，有助於降低心理負荷。": "心配はリスクを予測する脳の働きですが、予測は事実ではありません。制御できることとできないことを分けると、心の負担が軽くなります。", "我擔心健康或安全，覺得可能會出問題": "健康や安全が心配で、問題が起きるかもと感じる", "我擔心工作或家庭責任，覺得自己可能做不好": "仕事や家庭の責任が心配で、うまくできないかもと感じる", "我擔心人際關係，覺得可能被拒絕或誤解": "人間関係が心配で、拒絶や誤解を恐れる", "我反覆想像未來，覺得最壞的情況可能發生": "未来を繰り返し想像し、最悪の事態を恐れる", "我沒有足夠資訊，所以一直不放心": "十分な情報がなく、ずっと不安だ", "蒐集可靠且足夠的資訊": "信頼でき十分な情報を集める", "寫下目前可以控制的部分": "今コントロールできることを書き出す", "完成一個最小可行步驟": "最小の実行可能な一歩を終える", "暫停反覆搜尋與思考": "繰り返しの検索と思考を一旦止める", "找可信任的人一起討論": "信頼できる人と一緒に話し合う", "這份迷失的感受可能來自哪裡？": "この迷いはどこから来ている可能性がありますか？", "原本的目標改變了，覺得過去的方法不再適合": "目標が変わり、以前の方法が合わなくなった", "我有太多選擇，覺得每一個都難以決定": "選択肢が多すぎ、どれも決めづらい", "我不知道自己真正想要什麼，覺得很混亂": "本当に何を望むか分からず、混乱している", "我的生活失去重心，覺得每天只是撐過去": "生活の軸を失い、毎日をただやり過ごしている", "暫停不必要的重大決定": "不要な重大な決断を一旦止める", "列出目前最重要的三件事": "今最も大切な三つを書き出す", "選擇一個小方向先嘗試": "小さな方向を一つ選んで試す", "找可信任的人一起整理": "信頼できる人と一緒に整理する", "先恢復基本生活作息": "まず基本的な生活リズムを取り戻す", "這個無聊的感受，可能來自什麼？": "この退屈は何から来ている可能性がありますか？", "現在可以做哪件事？": "今、何ができますか？", "無聊可能代表大腦缺少刺激，也可能來自疲憊或缺乏意義感。先判斷需要活動還是休息，再採取行動。": "退屈は脳の刺激不足かもしれませんし、疲れや意味の欠如から来ることもあります。まず活動か休息かを見極めてから動きましょう。", "現在做的事情太重複，覺得沒有新鮮感": "今していることが反復的で、新鮮味がない", "活動太簡單，覺得沒有挑戰": "活動が簡単すぎて、挑戦が感じられない", "我不知道自己想做什麼，覺得時間很空": "何がしたいか分からず、時間が空虚に感じる", "我對很多事情都提不起興趣": "多くのことに興味が湧かない", "我其實很累，只是不知道該休息還是活動": "本当は疲れていて、休むべきか動くべきか分からない", "換一個活動或環境": "別の活動や環境に変える", "學習一件簡單的新事物": "簡単な新しいことを一つ学ぶ", "起身走動或伸展": "立って動くか伸びをする", "聯絡一位朋友": "友人に連絡する", "先休息，確認是不是疲憊": "まず休み、疲れかどうか確認する", "這個困惑的感受主要來自什麼？": "この戸惑いは主に何から来ていますか？", "資訊太多，我覺得腦中很混亂": "情報が多すぎ、頭が混乱している", "不同資訊彼此矛盾，我不知道該相信哪一個": "情報同士が矛盾し、どれを信じればいいか分からない", "我沒有理解內容，覺得自己跟不上": "内容を理解できず、ついていけないと感じる", "選項太多，我怕做錯決定": "選択肢が多すぎ、間違った決断を恐れる", "我不知道真正的問題在哪裡": "本当の問題がどこにあるか分からない", "把問題拆成幾個小部分": "問題を小さな部分に分ける", "先確認已知與未知": "まず既知と未知を整理する", "暫停接收更多資訊": "これ以上の情報収集を止める", "找有經驗的人說明": "経験者に説明してもらう", "只處理最重要的一個問題": "最も重要な一つの問題だけに取り組む", "目前的狀態比較接近哪一種？": "今の状態はどれに近いですか？", "現在可以從哪裡開始？": "今、どこから始められますか？", "當壓力超過負荷時，大腦有時會暫時降低情緒感受。先從簡單的身體感覺開始，不必逼自己立刻找到答案。": "ストレスが限界を超えると、脳は一時的に感情を鈍らせることがあります。まず簡単な体の感覚から始め、すぐに答えを出そうと焦らなくて大丈夫です。", "我經歷太多事情，覺得自己好像關掉情緒": "多くを経験し、感情をオフにしたように感じる", "我對原本喜歡的事失去興趣": "以前好きだったことへの興味を失った", "我感覺和周圍的人事物有距離": "周囲の人や物事と距離を感じる", "我腦中一片空白，什麼都不想": "頭が真っ白で、何も考えたくない", "我分不清自己是平靜，還是沒有感覺": "平静なのか無感覚なのか区別がつかない", "注意自己的呼吸與心跳": "自分の呼吸と鼓動に気づく", "感受身體是冷、熱、緊或鬆": "体が冷たい・温かい・緊張・弛緩かを感じる", "喝水、洗臉或起身走動": "水を飲む・顔を洗う・立って動く", "找可信任的人陪伴": "信頼できる人にそばにいてもらう", "若持續很久，尋求專業協助": "長く続くなら専門家の助けを求める", "這個煩躁的感受，最可能來自什麼？": "この苛立ちは何から来ている可能性が高いですか？", "事情太多、時間太少，我覺得快來不及": "やることが多く時間が足りず、間に合わないと感じる", "我一直被打斷，覺得無法專心": "ずっと中断され、集中できない", "我等了很久，覺得事情不受控制": "長く待たされ、物事が制御できないと感じる", "我很累或肚子餓，覺得任何事都很惱人": "疲れや空腹で、何もかも煩わしい", "周圍刺激太多，我覺得快要受不了": "周囲の刺激が多すぎ、耐えられそうにない", "到安靜的地方停留幾分鐘": "静かな場所に数分とどまる", "喝水或補充食物": "水を飲むか食べ物をとる", "減少一項不必要的任務": "不要なタスクを一つ減らす", "把事情重新排序": "物事を並べ替える", "暫時離開刺激過多的環境": "刺激の多い環境から一時離れる", "這份憤怒主要來自什麼？": "この怒りは主に何から来ていますか？", "我覺得不被尊重，心想對方不應該這樣對我": "尊重されていないと感じ、こんな扱いはおかしいと思う", "我覺得事情不公平，心想自己受到了不合理對待": "不公平だと感じ、理不尽な扱いを受けたと思う", "我的界線被越過，心想必須保護自己": "境界を越えられ、自分を守らねばと思う", "我累積太久，心想已經不能再忍了": "長くため込み、もう我慢できないと思う", "事情沒有照預期發展，心想一切都失控了": "思い通りにいかず、すべてが制御不能だと思う", "暫時離開現場": "一旦その場を離れる", "放慢呼吸，讓身體降溫": "呼吸を緩め、体を落ち着かせる", "透過走動或伸展釋放緊繃": "歩いたり伸ばしたりして緊張を解く", "整理真正想表達的重點": "本当に伝えたい要点を整理する", "等情緒降低後再溝通": "感情が落ち着いてから話す", "憤怒常在提醒我們，重要需求、價值或界線受到侵犯。情緒可以被理解，但行動仍然可以選擇。": "怒りは、大切な必要・価値・境界が侵されたという合図であることが多いです。感情は理解できますが、行動は選ぶことができます。", "恐懼主要來自什麼？": "恐れは主に何から来ていますか？", "現在最需要什麼？": "今、最も必要なものは？", "眼前可能有危險，我覺得自己需要立刻保護自己": "目の前に危険があるかもしれず、すぐ自分を守る必要を感じる", "我擔心受傷或生病，覺得情況可能會惡化": "けがや病気を恐れ、状況が悪化するかもと感じる", "我害怕失敗，覺得自己可能無法承受結果": "失敗を恐れ、結果に耐えられないかもと感じる", "我害怕被拒絕，覺得自己可能不被接受": "拒絶を恐れ、受け入れられないかもと感じる", "過去的經驗被勾起，我覺得相同的事又會發生": "過去の経験が呼び起こされ、同じことが起きると感じる", "確認周圍是否安全": "周囲が安全か確認する", "離開可能危險的環境": "危険の可能性がある環境から離れる", "放慢呼吸並觀察周遭": "呼吸を緩め、周囲を観察する", "尋求專業或緊急協助": "専門家や緊急の助けを求める", "恐懼會啟動逃跑、抵抗或僵住反應。這是身體的保護機制，應先確認安全，再處理情緒。": "恐れは逃走・闘争・凍りつき反応を起こします。これは体の防御機構であり、まず安全を確認してから感情に向き合いましょう。", "這份悲傷最接近哪一種情況？": "この悲しみはどの状況に近いですか？", "此刻最需要的是？": "今この瞬間、最も必要なものは？", "我失去重要的人事物，覺得生活少了一部分": "大切な人や物を失い、生活の一部が欠けたと感じる", "我的期待落空，覺得努力沒有結果": "期待が外れ、努力が報われないと感じる", "我感覺不被理解，覺得沒有人真正懂我": "理解されず、誰も本当には分かってくれないと感じる", "我想起痛苦經驗，覺得傷口又被碰觸": "つらい経験を思い出し、傷がまた触れられたと感じる", "我不知道原因，只覺得心裡很沉重": "理由は分からないが、ただ心が重い", "允許自己安靜或流淚": "静かにする、または泣くことを自分に許す", "找一位可信任的人傾聽": "信頼できる人に聞いてもらう", "讓身體得到休息": "体を休ませる", "做一件讓自己感到安全的小事": "安心できる小さなことを一つする", "若持續影響生活，尋求專業協助": "生活に影響し続けるなら専門家の助けを求める", "悲傷常出現在失去或重要需求未被滿足時。允許情緒存在，是大腦整理與適應經驗的一部分。": "悲しみは喪失や大切な必要が満たされないときに生じます。感情の存在を許すことは、脳が経験を整理し適応する過程の一部です。", "這份羞愧的感受，主要來自哪裡？": "この恥じらいは主にどこから来ていますか？", "現在最需要怎麼做？": "今、何をするのが最も必要ですか？", "我做了一件後悔的事，覺得自己很糟糕": "後悔することをし、自分がひどいと感じる", "我被批評或否定，覺得別人看不起我": "批判や否定をされ、見下されたと感じる", "我沒有達到期待，覺得自己不夠好": "期待に届かず、自分は不十分だと感じる", "我的缺點被看見，覺得很想躲起來": "欠点を見られ、隠れたくなる", "我反覆想起過去錯誤，覺得自己沒有資格被接受": "過去の過ちを繰り返し思い出し、受け入れられる資格がないと感じる", "分清楚行為錯誤與自我價值": "行為の誤りと自己価値を分ける", "修正可以改變的部分": "変えられる部分を正す", "停止反覆責罵自己": "繰り返し自分を責めるのをやめる", "用對待朋友的方式安慰自己": "友達に接するように自分を慰める", "找可信任的人談談": "信頼できる人に話す", "羞愧容易讓人從「我做錯了」變成「我整個人很糟」。行為可以修正，但一次錯誤不等於全部的自我價值。": "恥は「私は間違えた」を「私はダメな人間だ」に変えがちです。行動は正せますが、一度の過ちが自己価値のすべてではありません。", "這個絕望的感受，主要來自哪裡？": "この絶望は主にどこから来ていますか？", "現在最需要哪個行動？": "今、どの行動が最も必要ですか？", "我努力很久仍沒有改善，覺得做什麼都沒用": "長く努力しても改善せず、何をしても無駄だと感じる", "我看不到任何選擇，覺得未來不會變好": "選択肢が見えず、未来が良くならないと感じる", "我失去重要支持，覺得只能一個人承受": "大切な支えを失い、一人で抱えるしかないと感じる", "我的身心已經很疲累，覺得自己快撐不下去": "心身ともに疲れ果て、もう持ちこたえられないと感じる", "我覺得生活沒有意義，也不想再面對": "生活に意味を感じられず、もう向き合いたくない", "先完成吃飯、喝水與休息": "まず食事・水分・休息を済ませる", "立即聯絡可信任的人": "信頼できる人にすぐ連絡する", "不要獨自待著": "一人でいないようにする", "尋求心理或醫療專業協助": "心理または医療の専門家の助けを求める", "若有傷害自己的想法，立即求助緊急資源": "自分を傷つけたい考えがあれば、すぐに緊急の支援を求めてください", "絕望會讓大腦縮小注意範圍，使人暫時看不見其他可能。此刻先建立安全、陪伴與支持，比解決所有問題更重要。": "絶望は脳の注意範囲を狭め、他の可能性が一時的に見えなくなります。今はすべてを解決するより、安全・寄り添い・支えをつくることが大切です。", "忌妒主要在什麼情境出現？": "妬みは主にどんな場面で現れますか？", "現在可以怎麼做？": "今、どうできますか？", "別人得到我想要的成果，我覺得自己落後了": "他人が私の望む成果を得て、遅れていると感じる", "別人受到肯定，我覺得自己不被重視": "他人が認められ、自分は評価されないと感じる", "我擔心重要的人離開我，覺得自己會被取代": "大切な人が離れ、自分が取って代わられると恐れる", "我一直和別人比較，覺得自己不夠好": "ずっと人と比べ、自分は不十分だと感じる", "我看見別人的優勢，覺得自己缺少同樣的機會": "他人の強みを見て、同じ機会がないと感じる", "暫停反覆比較": "繰り返しの比較を止める", "把羨慕轉成具體目標": "羨望を具体的な目標に変える", "看見自己已經擁有的能力": "すでにある自分の力に気づく", "清楚表達自己的需要": "自分の必要をはっきり伝える", "減少讓自己不舒服的社群刺激": "不快にさせるSNSの刺激を減らす", "忌妒通常來自社會比較，以及對失去、落後或不被重視的擔心。它也能成為辨認內在需求的線索。": "妬みは社会的比較や、喪失・遅れ・軽視への不安から生じます。内なる必要に気づく手がかりにもなります。", "這個自責的感受，主要來自哪裡？": "この自責は主にどこから来ていますか？", "我做了違背自己價值的事，覺得應該負責": "自分の価値に反することをし、責任を取るべきだと感じる", "我傷害或忽略了別人，覺得自己做錯了": "人を傷つけたり無視したりし、間違えたと感じる", "我沒有完成責任，覺得讓別人失望": "責任を果たせず、人を失望させたと感じる", "結果不好，我覺得全部都是我的錯": "結果が悪く、すべて自分のせいだと感じる", "即使事情無法控制，我仍覺得自己應該做得更好": "制御できないことでも、もっとうまくやれたはずと感じる", "道歉或進行補救": "謝るか埋め合わせをする", "找出下次可以調整的行為": "次回調整できる行動を見つける", "分清楚自己真正的責任": "自分の本当の責任を見極める", "接受已經無法改變的部分": "もう変えられない部分を受け入れる", "停止用懲罰自己的方式負責": "自分を罰する形で責任を取るのをやめる", "適度自責可以幫助修正行為；過度自責則會消耗心理能量。負責不等於持續懲罰自己。": "適度な自  女 0.44–1.03 mg/dL", "📌 參考值：< 100 正常｜100–125 前期｜≥ 126 糖尿病（需複診）": "📌 参考値：< 100 正常｜100–125 前段階｜≥ 126 糖尿病（要再診）", "尿酸偏高與高普林飲食、痛風有關。多喝水、減少內臟與海鮮攝取有助控制。": "尿酸高値はプリン体の多い食事や痛風と関係します。水分を多くとり、内臓類や魚介を控えると改善に役立ちます。", "肌酸酐反映腎臟過濾功能。偏高常見於急慢性腎功能障礙；肌肉量少的長者可能偏低。": "クレアチニンは腎臓のろ過機能を反映します。高値は急慢性腎機能障害に多く、筋肉量の少ない高齢者は低めになることがあります。", "反映當下空腹血糖狀態。811 空腹讓胰島素休息，有助改善胰島素阻抗、穩定血糖。": "現在の空腹時血糖を反映します。811の空腹はインスリンを休ませ、インスリン抵抗の改善と血糖安定に役立ちます。", "eGFR 估算腎臟過濾效率，是評估腎功能的重要指標。數值越低代表腎功能越需留意。": "eGFRは腎臓のろ過効率を推定し、腎機能評価の重要な指標です。値が低いほど腎機能に注意が必要です。", "三酸甘油脂偏高與高糖高油飲食、飲酒有關。注意低脂低糖飲食、限制飲酒、積極運動有助下降。": "中性脂肪の高値は高糖質・高脂肪の食事や飲酒と関係します。低脂肪・低糖食、飲酒制限、積極的な運動が低下に役立ちます。", "俗稱「壞膽固醇」，偏高會增加動脈硬化風險。減少飽和與反式脂肪、增加纖維與運動有助改善。": "いわゆる「悪玉コレステロール」で、高いと動脈硬化リスクが上がります。飽和脂肪・トランス脂肪を減らし、食物繊維と運動を増やすと改善に役立ちます。", "俗稱「好膽固醇」，能幫助清除血管中的膽固醇，數值越高越好。規律運動、健康油脂有助提升。": "いわゆる「善玉コレステロール」で、血管内のコレステロールを除去し、高いほど良好です。規則的な運動と良質な油で上がります。", "總膽固醇偏高易造成動脈硬化，增加心血管疾病風險。空腹淨化、811 飲食與規律運動有助改善。": "総コレステロール高値は動脈硬化を招き心血管リスクを高めます。空腹浄化・811食・規則的な運動が改善に役立ちます。", "血紅素負責攜帶氧氣。偏低常見於貧血（需配合 MCV 判斷類型）；偏高可能與缺氧、心肺疾病、腎臟病或脫水有關。": "ヘモグロビンは酸素を運びます。低値は貧血に多く（MCVで型を判断）、高値は低酸素・心肺疾患・腎疾患・脱水と関係することがあります。", "體脂率是細胞控重的核心指標。脂肪細胞過多會釋放促炎因子，讓全身持續慢性發炎，粒線體效能下降。E生愛快充幫助淨化→消炎→活化，讓體脂逐步回到健康範圍。": "体脂肪率は細胞体重管理の核心指標です。脂肪細胞が多すぎると炎症促進因子が放出され、全身が慢性炎症となりミトコンドリア機能が低下します。Eチャージは浄化→抗炎→活性化を助け、体脂肪を健康範囲へ戻します。", "內臟脂肪包圍心、肝、胰等器官，是代謝症候群的主要推手。即使體重正常，內臟脂肪過高仍會導致胰島素阻抗。空腹計時（空腹15–16小時）是降低內臟脂肪最有效的方式之一。": "内臓脂肪は心臓・肝臓・膵臓などを取り囲み、メタボリックシンドロームの主因です。体重が正常でも内臓脂肪が多いとインスリン抵抗を招きます。空腹タイマー（15–16時間）は内臓脂肪を減らす最も有効な方法の一つです。", "腰圍是內臟脂肪的外部指標，也是代謝健康最簡單的評估工具。腰圍超標代表腹部內臟脂肪堆積，心血管疾病風險升高。每天動一動 30 分鐘，搭配 811 飲食，是縮腰圍最自然的方式。": "ウエストは内臓脂肪の外的指標で、代謝の健康を測る最も簡単な指標です。基準超えは腹部内臓脂肪の蓄積と心血管リスク上昇を示します。毎日30分動き、811食と合わせるのが最も自然な引き締め方です。", "每一次充電都在啟動細胞AI。": "一回一回のチャージが細胞AIを起動しています。", "持續快充、持續行動，": "チャージを続け、行動を続けて、", "讓細胞找回健康節奏。": "細胞が健康のリズムを取り戻せますように。", "— CELL CHARGE 愛菲亞細胞快充站 —": "— CELL CHARGE アイフィア細胞チャージ —", "CELL CHARGE 愛菲亞細胞快充站": "CELL CHARGE アイフィア細胞チャージ", "啟動細胞力，領創AI新紀元": "細胞力を起動し、AI新時代を切り拓く", "活化細胞 · 活出愛 · 讓愛飛呀！": "細胞を活性化 · 愛を生きる · 愛よ飛べ！", "本週充電行動成果": "今週のチャージ成果", "本週量測統計": "今週 乾淨，身體代謝越順，精神、循環、消化與修復力都會比較好。": "세포 환경이 깨끗할수록 대사가 원활해져 활력·순환·소화·수복이 좋아집니다.", "⚡ AIFYA 愛菲亞細胞快充站 ‧ 每日五個開關，啟動細胞滿電生活": "⚡ AIFYA 아이피아 세포충전 · 매일 다섯 스위치로 완충 생활", "自訂每天要吃的食物、營養品與藥物，設定飯前／飯後／時間，每天打勾記錄。": "매일 먹을 음식·영양제·약을 설정하고 식전/식후/시간을 정해 매일 체크.", "當發炎負擔降低，細胞修復會比較順暢，身體也比較不容易疲倦、痠痛、卡關。": "염증 부담이 줄면 세포 수복이 원활해지고 피로·통증·정체가 줄어듭니다.", "評估你的細胞淨化力，了解身體目前的健康狀態，找到最適合你的細胞快充策略。": "세포 정화력을 평가해 현재 건강 상태를 파악하고 최적의 충전 전략을 찾으세요.", "「吃對時間」讓身體有完整的消化→整理→修復三個階段，是細胞控重最自然的方式": "“올바른 시간”은 소화→정리→수복의 3단계를 갖춰 가장 자연스러운 체중관리법", "細胞快充三步驟：淨化→消炎→活化，讓60兆細胞重新甦醒，活出豐盛滿電生命。": "세포충전 3단계: 정화→항염→활성화로 60조 세포를 재각성시켜 풍성한 완충 인생을.", "體重、血壓、進階量測與常規血液檢測全部一起匯出，用 Excel 開啟即可追蹤變化。": "체중·혈압·상세 측정·혈액검사를 함께 내보내 Excel로 변화를 추적.", "提升粒線體產生能量效率，身體得活力提升、精神、修復代謝效率變好，更能維持健康節奏。": "미토콘드리아 효율을 높여 활력·수복·대사가 좋아지고 건강 리듬을 유지.", "要回填以前的健檢報告，先在這裡選好那份報告的日期，再輸入下面各項數值，就能記錄變化。": "과거 검진을 입력하려면 먼저 보고서 날짜를 선택한 뒤 아래 수치를 입력해 변화를 기록.", "彩虹飲食 × 吃對時間 = 細胞最佳修復環境。每天記錄吃過的顏色，讓七彩蔬果滋養60兆細胞。": "무지개 식사 × 올바른 시간 = 최적의 세포 수복 환경. 매일 색을 기록해 60조 세포를 돌보세요.", "營養密度高，搭配七彩蔬果最穩妥。點食材記錄吃過、按「本週吃過」計次。本週已碰：0 / 7 類": "영양 밀도가 높아 무지개 채소·과일과 잘 맞음. 식재료를 탭해 기록, “이번 주 먹음”으로 계수. 이번 주: 0 / 7 종", "把這一週的體重、血壓與進階量測整理成一張美圖，一鍵分享到 LINE，見證上帝保守的健康恩典。": "이번 주 체중·혈압·상세 측정을 한 장의 이미지로 만들어 LINE으로 공유, 하나님의 지키시는 은혜를 증거.", "空腹13–16小時後，細胞自噬（Autophagy）啟動，清除受損蛋白質與老廢物，細胞重獲新生": "13–16시간 공복 후 자가포식이 시작돼 손상 단백질과 노폐물을 제거하고 세포가 재생", "每台裝置有獨立識別碼，資料只存在您自己的手機。分享此 App 給別人，對方的資料完全獨立不互混。": "각 기기에 고유 ID가 있고 데이터는 내 폰에만 저장. 앱을 공유해도 상대 데이터는 완전히 독립.", "以下為常見健檢血液指標與參考範圍，可記錄你的檢驗數值追蹤變化。實際判讀請以檢驗報告與醫師建議為準。": "아래는 일반 혈액 지표와 참고 범위입니다. 수치를 기록해 변화를 추적하세요. 판독은 검사 보고서와 의사의 조언을 따르세요.", "— 馬太福音 11:28": "— 마태복음 11:28", "「凡勞苦擔重擔的人可以到我這裡來，我就使你們得安息。」": "“수고하고 무거운 짐 진 자들아 다 내게로 오라 내가 너희를 쉬게 하리라”", "「你們或吃或喝，無論做甚麼，都要為榮耀上帝而行。」（哥林多前書 10:31）": "“그런즉 너희가 먹든지 마시든지 무엇을 하든지 다 하나님의 영광을 위하여 하라” (고린도전서 10:31)", "「凡上帝所造的物都是好的，若感謝著領受，就沒有一樣可棄的。」（提摩太前書 4:4）": "“하나님께서 지으신 모든 것이 선하매 감사함으로 받으면 버릴 것이 없나니” (디모데전서 4:4)", "「親愛的兄弟啊，我願你凡事興盛，身體健壯，正如你的靈魂興盛一樣。」（約翰三書 1:2）": "“사랑하는 자여 네 영혼이 잘됨 같이 네가 범사에 잘되고 강건하기를 내가 간구하노라” (요한삼서 1:2)", "「我深信那在你們心裡動了善工的，必成全這工，直到耶穌基督的日子。」（腓立比書 1:6）": "“너희 안에서 착한 일을 시작하신 이가 그리스도 예수의 날까지 이루실 줄을 우리는 확신하노라” (빌립보서 1:6)", "「你們豈不知道，你們的身子就是聖靈的殿嗎？……所以，要在你們的身子上榮耀上帝。」（哥林多前書 6:19–20）": "“너희 몸은 너희 가운데 계신 성령의 전인 줄을 알지 못하느냐 … 그런즉 너희 몸으로 하나님께 영광을 돌리라” (고린도전서 6:19–20)", "長時間進食、餐餐不斷，身體的胰島素就會不斷分泌，久了容易出現胰島素阻抗、脂肪囤積、代謝變慢等問題。透過 811 模式讓胰島素休息，細胞才能回到原廠設定，開始「自我淨化、修復、燃脂」。空腹好處不只是體重下降，還可以——": "오래 끊임없이 먹으면 인슐린이 계속 분비되어 시간이 지나면 인슐린 저항·지방 축적·대사 저하를 부릅니다. 811로 인슐린을 쉬게 하면 세포가 “공장 초기화”로 돌아가 스스로 정화·수복·지방연소를 시작합니다. 공복의 유익은 체중 감소만이 아니라—", "還沒有自訂項目。點上方「＋ 新增項目」，把每天要吃的食物、營養品或藥物加進來吧 🌱": "맞춤 항목이 아직 없습니다. 위의 “＋ 항목 추가”로 매일 음식·영양제·약을 추가하세요 🌱", "：每週找 5 天、每天找 3 個時段，一動共 30 分鐘。": "：주 5일, 하루 3회, 합쳐 30분 움직이기.", "🔬 每週累積 150 分鐘中等強度運動，顯著降低心血管疾病風險。": "🔬 주 150분 중강도 운동은 심혈관 질환 위험을 크게 낮춥니다.", "🔬 適度日照促進維生素 D 合成，調節情緒與睡眠節律。": "🔬 적당한 햇볕은 비타민D 합성을 촉진해 기분·수면 리듬을 조절합니다.", "🔬 規律 7–9 小時睡眠修復身心，鞏固記憶與免疫。": "🔬 규칙적인 7–9시간 수면이 몸맘을 회복하고 기억·면역을 강화합니다.", "🔬 足量飲水維持代謝與血液循環，晨起一杯溫水啟動腸胃。": "🔬 충분한 수분이 대사·혈액순환을 유지 — 기상 후 따뜻한 물 한 잔이 장을 깨웁니다.", "設定一個時間（例如上午 11:00）。若當天還沒充電，手機會跳出提醒：「今日尚未充電，趕緊打開 APP，完成今日充電行動吧！」": "시간을 설정하세요(예: 오전 11:00). 그날 충전 전이면 알림: “오늘 아직 충전 안 함 — 앱을 열어 오늘 충전 행동을 완료하세요!”", "關閉": "닫기", "📋 複製": "📋 복사", "💬 微信": "💬 위챗", "💾 儲存圖片": "💾 이미지 저장", "📨 直接傳到：": "📨 바로 보내기:", "📨 或直接把文字傳到：": "📨 또는 문자를 바로 보내기:", "👆 長按上面的圖片來分享": "👆 위 이미지를 길게 눌러 공유", "會跳出選單，選": "메뉴가 뜨면 선택", "傳到微信／LINE／WhatsApp，或": "로 WeChat／LINE／WhatsApp에 보내기, 또는", "Save to Photos（存到相簿）": "Save to Photos(앨범에 저장)", "Share…（分享）": "Share…(공유)", "📤 一鍵分享（此環境無法使用）": "📤 원탭 공유(이 환경에서는 불가)", "📤 一鍵分享圖片（選擇任何 App）": "📤 이미지 공유(앱 선택)", "（微信沒有網頁分享，會先幫您複製文字，再開微信貼上即可）": "(위챗은 웹 공유가 없어 문자를 복사해 드립니다 — 위챗을 열어 붙여넣기)", "正常": "정상", "注意": "주의", "偏高": "높음", "偏低": "낮음", "前期": "전단계", "糖尿病": "당뇨", "為警示": "경고", "男≧40/女≧50": "남≥40 / 여≥50", "01　血液常規檢查": "01  일반 혈액검사", "02　血脂肪檢查": "02  혈중 지질검사", "03　糖尿病相關檢查": "03  당뇨 관련검사", "04　肝功能檢查": "04  간 기능검사", "05　腎功能檢查": "05  신장 기능검사", "🩸 血液常規檢測參考資料": "🩸 혈액검사 참고자료", "白血球": "백혈구", "紅血球": "적혈구", "血色素": "혈색소", "血小板": "혈소판", "平均血球容積": "평균 적혈구 용적(MCV)", "血球容積比": "적혈구용적률(HCT)", "總膽固醇": "총콜레스테롤", "三酸甘油脂": "중성지방", "高密度脂蛋白 需要透過持續且具體的行動表達。": "사랑과 안전한 연결은 뇌의 정서 조절을 돕고 고립감을 줄입니다. 안정된 관계는 꾸준하고 구체적인 행동으로 표현됩니다.", "我想靠近重要的人，覺得和他有深厚連結": "소중한 사람에게 가까이 가고 싶고 깊은 연결을 느낌", "我想照顧某個人，覺得他的感受很重要": "누군가를 돌보고 싶고 그의 감정이 중요하다고 느낌", "我被理解與接納，覺得很安全": "이해받고 받아들여져 안전하다고 느낌", "我對自己感到溫柔，覺得值得被照顧": "자신에게 다정해지고 돌봄받을 가치가 있다고 느낌", "我對生命、動物或自然感到親近": "생명·동물·자연에 가까움을 느낌", "說一句關心或肯定的話": "관심이나 격려의 말을 한마디 하기", "給予陪伴或擁抱": "함께 있어 주거나 안아주기", "主動提供實際幫助": "먼저 실질적인 도움을 주기", "為自己做一件照顧身體的事": "자신의 몸을 돌보는 일 하나를 하기", "留一點時間陪伴重要的人": "소중한 사람과 함께할 시간을 남기기", "這份敬畏主要來自什麼？": "이 경외는 주로 무엇에서 오나요?", "你想如何回應這份感受？": "이 느낌에 어떻게 반응하고 싶나요?", "敬畏感能讓注意力暫時離開過度自我關注，擴展到更大的生命經驗，有助於重新整理觀點。": "경외는 지나친 자기 집중에서 벗어나 더 큰 삶의 경험으로 주의를 넓혀 관점을 재정비하도록 돕습니다.", "我看見壯麗的自然，覺得世界比自己更廣大": "웅장한 자연을 보고 세상이 나보다 훨씬 크다고 느낌", "我感受到生命或科學的奧妙，覺得不可思議": "생명이나 과학의 신비를 느끼고 경이롭다고 느낌", "我被藝術或音樂觸動，覺得非常震撼": "예술이나 음악에 감동해 큰 울림을 느낌", "我看見他人的勇氣與成就，覺得深受感動": "다른 사람의 용기와 성취를 보고 깊이 감동함", "我突然對人生有新的理解，覺得視野被打開": "삶에 대한 새 이해가 생겨 시야가 열렸다고 느낌", "安靜停留，感受這個時刻": "조용히 머물러 이 순간을 느끼기", "拍照或記錄": "사진을 찍거나 기록하기", "和別人分享這份感受": "이 느낌을 다른 사람과 나누기", "把感動轉化為一個行動": "감동을 하나의 행동으로 옮기기", "暫時放下日常煩惱": "일상의 걱정을 잠시 내려놓기", "這個疲憊得感受最可能來自什麼？": "이 피로는 무엇에서 올 가능성이 큰가요?", "現在最需要哪種調整？": "지금 어떤 조정이 가장 필요한가요?", "疲憊會降低專注、判斷與情緒調節能力。若長期休息後仍未改善，也需要留意身體與心理狀態。": "피로는 집중·판단·정서 조절을 떨어뜨립니다. 오래 쉬어도 나아지지 않으면 몸과 마음 상태도 살펴야 합니다.", "我睡眠不足，覺得身體需要補眠": "잠이 부족해 몸이 수면을 필요로 함", "我工作或活動太久，覺得能量被消耗": "너무 오래 일하거나 움직여 에너지가 소모됨", "我承受壓力很久，覺得什麼都不想做": "오래 스트레스를 받아 아무것도 하기 싫음", "我一直照顧別人，覺得沒有力氣照顧自己": "계속 남을 돌보느라 나를 돌볼 힘이 없음", "我沒有明顯原因，卻持續覺得很累": "뚜렷한 이유 없이 계속 매우 피곤함", "補充水分或食物": "물이나 음식을 보충하기", "閉眼休息幾分鐘": "눈을 감고 몇 분 쉬기", "起身伸展或短暫散步": "일어나 스트레칭하거나 잠깐 산책하기", "暫停不必要的工作": "불필요한 일을 잠시 멈추기", "安排睡眠或尋求專業評估": "수면을 계획하거나 전문가 평가를 받기", "這份孤單比較接近哪種狀況？": "이 외로움은 어떤 상황에 가깝나요?", "現在可以做哪個小行動？": "지금 할 수 있는 작은 행동은?", "孤單是大腦提醒我們需要人際連結的訊號，不代表自己不受歡迎，也不代表只能獨自承受。": "외로움은 연결이 필요하다는 뇌의 신호이며, 당신이 환영받지 못한다거나 혼자 견뎌야 한다는 뜻이 아닙니다.", "身邊沒有人陪伴，我覺得很空": "곁에 아무도 없어 공허하게 느낌", "雖然有人在身邊，我仍覺得沒人理解": "사람이 있어도 아무도 이해하지 못한다고 느낌", "我和重要的人疏遠了，覺得失去連結": "소중한 사람과 멀어져 연결을 잃었다고 느낌", "我在陌生環境中，覺得沒有歸屬感": "낯선 환경 復。這時候的第一餐，不只是「吃東西」，更是啟動一天的活力與代謝。": "13–16시간 공복 후 몸은 밤 사이 정리와 회복을 막 마친 상태입니다. 이때의 첫 끼는 단순히 “먹는 것”이 아니라 하루의 활력과 대사를 시동 거는 일입니다.", "811快樂吃 × 每日細胞第一餐 = 細胞控重": "811 즐겁게 먹기 × 매일 세포 첫 끼 = 세포 체중관리", "先淨空，讓身體修復；再快充，讓細胞啟動；最後回到代謝恢復到穩定狀態，達到細胞控重。": "먼저 비워 몸을 회복하고, 빠르게 충전해 세포를 가동하며, 마지막으로 대사가 안정 상태로 돌아가 세포 체중관리를 이룹니다.", "「凡事謝恩，因為這是上帝在基督耶穌裡向你們所定的旨意。」— 帖撒羅尼迦前書 5:18": "“범사에 감사하라 이것이 그리스도 예수 안에서 너희를 향하신 하나님의 뜻이니라” — 데살로니가전서 5:18", "已複製：0EDB5171": "복사됨: 0EDB5171", "切換語言後畫面會重新載入。繁體、簡體為完整支援；英文、日文、韓文持續擴充中，未翻譯處會暫時顯示中文。": "언어를 바꾸면 화면이 다시 로드됩니다. 5개 언어를 지원하며 번역되지 않은 부분은 임시로 중국어로 표시됩니다.", "輸入血紅素 (g/dL)": "혈색소 입력 (g/dL)", "輸入 HbA1c (%)": "HbA1c 입력 (%)", "輸入尿酸 (mg/dL)": "요산 입력 (mg/dL)", "輸入肌酸酐 (mg/dL)": "크레아티닌 입력 (mg/dL)", "輸入總膽固醇 (mg/dL)": "총콜레스테롤 입력 (mg/dL)", "輸入空腹血糖 (mg/dL)": "공복혈당 입력 (mg/dL)", "輸入內臟脂肪等級 (1–30)": "내장지방 등급 입력 (1–30)", "輸入三酸甘油脂 (mg/dL)": "중성지방 입력 (mg/dL)", "輸入 LDL-C (mg/dL)": "LDL-C 입력 (mg/dL)", "輸入 HDL-C (mg/dL)": "HDL-C 입력 (mg/dL)", "輸入 eGFR (mL/min/1.73m²)": "eGFR 입력 (mL/min/1.73m²)", "📌 參考值：< 7.0 mg/dL": "📌 참고치: < 7.0 mg/dL", "📌 男性 < 90cm，女性 < 80cm": "📌 남성 < 90cm, 여성 < 80cm", "📌 理想值 1–9 級（Tanita 標準）": "📌 이상치 1–9등급(타니타 기준)", "📌 男性理想 10–20%，女性理想 18–28%": "📌 이상치: 남성 10–20%, 여성 18–28%", "📌 參考值：男 ≥ 40 / 女 ≥ 50 為佳，數值越高越好": "📌 참고치: 남 ≥ 40 / 여 ≥ 50이 좋음, 높을수록 좋음", "📌 參考值：≥ 90 正常｜60–89 輕度下降｜< 60 需注意": "📌 참고치: ≥ 90 정상｜60–89 경도 저하｜< 60 주의", "📌 參考值：< 200 正常｜200–239 注意｜≥ 240 偏高": "📌 참고치: < 200 정상｜200–239 주의｜≥ 240 높음", "📌 參考值：< 150 正常｜150–199 注意｜≥ 200 偏高": "📌 참고치: < 150 정상｜150–199 주의｜≥ 200 높음", "📌 參考值：< 100 正常｜100–129 注意｜≥ 130 偏高": "📌 참고치: < 100 정상｜100–129 주의｜≥ 130 높음", "📌 參考值：< 5.7 正常｜5.7–6.4 前期｜≥ 6.5 糖尿病": "📌 참고치: < 5.7 정상｜5.7–6.4 전단계｜≥ 6.5 당뇨", "📌 參考值：男 13.5–17.5 / 女 12.0–16.0 g/dL": "📌 참고치: 남 13.5–17.5 / 여 12.0–16.0 g/dL", "📌 參考值：男 0.64–1.27 / 女 0.44–1.03 mg/dL": "📌 참고치: 남 0.64–1.27 / 여 0.44–1.03 mg/dL", "📌 參考值：< 100 正常｜100–125 前期｜≥ 126 糖尿病（需複診）": "📌 참고치: < 100 정상｜100–125 전단계｜≥ 126 당뇨(재진 필요)", "尿酸偏高與高普林飲食、痛風有關。多喝水、減少內臟與海鮮攝取有助控制。": "요산 상승은 고퓨린 식사·통풍과 관련됩니다. 물을 많이 마시고 내장류·해산물을 줄이면 조절에 도움이 됩니다.", "肌酸酐反映腎臟過濾功能。偏高常見於急慢性腎功能障礙；肌肉量少的長者可能偏低。": "크레아티닌은 신장 여과 기능을 반영합니다. 높으면 급·만성 신장 장애에 흔하고, 근육량이 적은 어르신은 낮을 수 있습니다.", "反映當下空腹血糖狀態。811 空腹讓胰島素休息，有助改善胰島素阻抗、穩定血糖。": "현재 공복혈당 상태를 반영합니다. 811 공복은 인슐린을 쉬게 해 인슐린 저항 개선과 혈당 안정에 도움이 됩니다.", "eGFR 估算腎臟過濾效率，是評估腎功能的重要指標。數值越低代表腎功能越需留意。": "eGFR은 신장 여과 효율을 추정하는 신장 기능의 핵심 지표입니다. 수치가 낮을수록 신장 기능에 더 주의가 필요합니다.", "三酸甘油脂偏高與高糖高油飲食、飲酒有關。注意低脂低糖飲食、限制飲酒、積極運動有助下降。": "중성지방 상승은 고당·고지방 식사와 음주와 관련됩니다. 저지방·저당 식사, 음주 제한, 적극적 운동이 낮추는 데 도움이 됩니다.", "俗稱「壞膽固醇」，偏高會增加動脈硬化風險。減少飽和與反式脂肪、增加纖維與運動有助改善。": "이른바 “나쁜 콜레스테롤”로, 높으면 동맥경화 위험이 커집니다. 포화·트랜스지방을 줄이고 식이섬유와 운동을 늘리면 도움이 됩니다.", "俗稱「好膽固醇」，能幫助清除血管中的膽固醇，數值越高越好。規律運動、健康油脂有助提升。": "이른바 “좋은 콜레스테롤”로 혈관의 콜레스테롤 제거를 돕고 높을수록 좋습니다. 규칙적 운동과 건강한 지방이 높이는 데 도움이 됩니다.", "總膽固醇偏高易造成動脈硬化，增加心血管疾病風險。空腹淨化、811 飲食與規律運動有助改善。": "총콜레스테롤이 높으면 동맥경화를 일으켜 심혈관 위험이 커집니다. 공복 정화·811 식사·규칙적 운동이 도움이 됩니다.", "血紅素負責攜帶氧氣。偏低常見於貧血（需配合 MCV 判斷類型）；偏高可能與缺氧、心肺疾病、腎臟病或脫水有關。": "혈색소는 산소를 운반합니다. 낮으면 빈혈에 흔하고(MCV로 유형 판단), 높으면 저산소·심폐 질환·신장병·탈수와 관련될 수 있습니다.", "體脂率是細胞控重的核心指標。脂肪細胞過多會釋放促炎因子，讓全身持續慢性發炎，粒線體效能下降。E生愛快充幫助淨化→消炎→活化，讓體脂逐步回到健康範圍。": "체지방률은 세포 체중관리의 핵심 지표입니다. 지방세포가 많으면 염증 촉진 인자가 분비돼 온몸이 만성 염증 상태가 되고 미토콘드리아 효율이 떨어집니다. E충전은 정화→항염→활성화를 도와 체지방을 건강 범위로 돌립니다.", "內臟脂肪包圍心、肝、胰等器官，是代謝症候群的主要推手。即使體重正常，內臟脂肪過高仍會導致胰島素阻抗。空腹計時（空腹15–16小時）是降低內臟脂肪最有效的方式之一。": "내장지방은 심장·간·췌장 등 장기를 둘러싸 대사증후군의 주요 원인이 됩니다. 체중이 정상이어도 내장지방이 많으면 인슐린 저항이 생깁니다. 공복 타이머(15–16시간)는 내장지방을 줄이는 가장 효과적인 방법 중 하나입니다.", "腰圍是內臟脂肪的外部指標，也是代謝健康最簡單的評估工具。腰圍超標代表腹部內臟脂肪堆積，心血管疾病風險升高。每天動一動 30 分鐘，搭配 811 飲食，是縮腰圍最自然的方式。": "허리둘레는 내장지방의 외적 지표이자 대사 건강을 가늠하는 가장 간단한 도구입니다. 기준 초과는 복부 내장지방 축적과 심혈관 위험 상승을 뜻합니다. 매일 30분 움직이고 811 식사를 병행하는 것이 허리를 줄이는 가장 자연스러운 방법입니다.", "每一次充電都在啟動細胞AI。": "매 충전이 세포 AI를 가동하고 있습니다.", "持續快充、持續行動，": "꾸준히 충전하고 꾸준히 움직여", "讓細胞找回健康節奏。": "세포가 건강한 리듬을 되찾게 하세요.", "— CELL CHARGE 愛菲亞細胞快充站 —": "— CELL CHARGE 아이피아 세포충전 —", "CELL CHARGE 愛菲亞細胞快充站": "CELL CHARGE 아이피아 세포충전", "啟動細胞力，領創AI新紀元": "세포의 힘을 깨워 AI 신기원을 열다", "活化細胞 · 活出愛 · 讓愛飛呀！": "세포를 활성화 · 사랑으로 살기 · 사랑이여 날아라!", "本週充電行動成果": "이번 주 충전 성과", "本週量測統計": "이번 주 측정 통계", "📊 本週健康量測": "📊 이번       CanvasRenderingContext2D.prototype.fillText=function(t){ var a=arguments; if(getLang()!=='zh-TW'&&typeof t==='string'&&CJK.test(t)){ a=Array.prototype.slice.call(arguments); a[0]=tr(t); } return _ft.apply(this,a); };
      CanvasRenderingContext2D.prototype.strokeText=function(t){ var a=arguments; if(getLang()!=='zh-TW'&&typeof t==='string'&&CJK.test(t)){ a=Array.prototype.slice.call(arguments); a[0]=tr(t); } return _st.apply(this,a); };
      CanvasRenderingContext2D.prototype.measureText=function(t){ return _mt.call(this,(getLang()!=='zh-TW'&&typeof t==='string'&&CJK.test(t))?tr(t):t); };
    }
    ['alert','confirm','prompt'].forEach(function(n){ var o=window[n]; if(typeof o==='function'){ window[n]=function(m){ var a=Array.prototype.slice.call(arguments); if(getLang()!=='zh-TW'&&typeof m==='string') a[0]=tr(m); return o.apply(window,a); }; } });
  }catch(e){}
  function trText(tn){
    var raw=tn.nodeValue;
    if(!raw||!CJK.test(raw)) return;
    var m=raw.match(/^(\s*)([\s\S]*?)(\s*)$/);
    var lead=m[1],core=m[2],tail=m[3];
    if(!core) return;
    var o=tr(core);
    if(o!==core){ try{ tn.nodeValue=lead+o+tail; }catch(e){} }
  }
  var ATTRS=['placeholder','title','aria-label','alt'];
  function trAttrs(node){
    var a,v,o;
    for(a=0;a<ATTRS.length;a++){
      if(node.getAttribute){ v=node.getAttribute(ATTRS[a]); if(v&&CJK.test(v)){ o=tr(v.replace(/^\s+|\s+$/g,'')); if(o!==v.replace(/^\s+|\s+$/g,'')) try{node.setAttribute(ATTRS[a],o);}catch(e){} } }
    }
  }
  function walk(node){
    if(node.nodeType===3){ trText(node); return; }
    if(node.nodeType!==1) return;
    var tag=node.tagName;
    if(tag==='TEXTAREA'){ trAttrs(node); return; }
    if(tag==='SCRIPT'||tag==='STYLE') return;
    if(node.isContentEditable) return;
    if(node.getAttribute&&node.getAttribute('translate')==='no') return;
    trAttrs(node);
    var kids=node.childNodes,i;
    for(i=0;i<kids.length;i++) walk(kids[i]);
  }
  var observer=null,scheduled=false,pending=[];
  function flush(){
    scheduled=false;
    var batch=pending; pending=[];
    if(observer) observer.disconnect();
    var i; for(i=0;i<batch.length;i++){ try{ walk(batch[i]); }catch(e){} }
    reconnect();
  }
  function schedule(n){ pending.push(n); if(!scheduled){ scheduled=true; (window.requestAnimationFrame||function(f){setTimeout(f,0);})(flush); } }
  function reconnect(){ if(observer){ try{ observer.observe(document.body,{childList:true,subtree:true,characterData:true}); }catch(e){} } }
  function start(){
    if(getLang()==='zh-TW') return;
    try{ walk(document.body); }catch(e){}
    if(window.MutationObserver){
      observer=new MutationObserver(function(muts){
        var i,j; for(i=0;i<muts.length;i++){ var mu=muts[i];
          if(mu.type==='characterData'){ schedule(mu.target); }
          else { for(j=0;j<mu.addedNodes.length;j++) schedule(mu.addedNodes[j]); }
        }
      });
      reconnect();
    }
  }
  window._i18nSetLang=function(l){ setLang(l); try{location.reload();}catch(e){} };
  window._i18nGetLang=getLang;
  if(document.readyState==='complete'||document.readyState==='interactive'){ setTimeout(start,60); }
  else document.addEventListener('DOMContentLoaded',function(){ setTimeout(start,60); });
})();
